name: Branch policy

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier le sens de la pull request
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == "main" ]]; then
            [[ "$HEAD_BRANCH" == "dev" || "$HEAD_BRANCH" == hotfix/* ]] || {
              echo "Une pull request vers main doit venir de dev ou de hotfix/*."
              exit 1
            }
          elif [[ "$BASE_BRANCH" == "dev" ]]; then
            [[ "$HEAD_BRANCH" == "main" || "$HEAD_BRANCH" == feature/* || "$HEAD_BRANCH" == fix/* || "$HEAD_BRANCH" == chore/* ]] || {
              echo "Une pull request vers dev doit venir de feature/*, fix/*, chore/* ou main."
              exit 1
            }
          fi
